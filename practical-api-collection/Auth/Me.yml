info:
  name: Me
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/me"
  auth:
    type: bearer
    token: "{{patient_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Overview

  Returns the authenticated user's own profile. Not role-gated — swap the
  Authorization bearer value to `{{admin_token}}` to check the admin session
  instead of the patient one.

  ---

  ## Response (success — 200):-

  ```json
  {
    "data": {
      "id": 2,
      "name": "Test Patient",
      "email": "patient@example.com",
      "role": "patient"
    }
  }
  ```

  ---

  ## Error Responses

  * `401` — missing or invalid bearer token

  ---
