info:
  name: Available Slots
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/doctors/1/slots?date=2026-09-21"
  params:
    - name: date
      value: "2026-09-21"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Overview

  Returns the doctor's actually-bookable slots for one calendar date: every
  matching weekday's `start_time`–`end_time` window(s) from
  `doctor_availabilities` — a day can have more than one, e.g. split
  morning/afternoon hours — cut into `slot_duration_minutes` chunks (default
  30, `config('appointments.slot_duration_minutes')`), with anything that
  falls inside one of the doctor's `doctor_breaks` for that date, any
  already-`booked` slot, and any slot already in the past removed. This is
  the only endpoint that should drive the patient's slot picker — never
  compute slots client-side.

  A cancelled appointment's slot reappears here immediately, since only
  `status = booked` rows are excluded. Likewise, a slot an admin's break just
  bumped an appointment out of opens up here the moment the break is saved.

  ---

  ## Path Parameter

  * `{doctor}` — integer ID of the doctor

  ---

  ## date:-

  * Type: string
  * Required: Yes
  * Format: `Y-m-d`
  * Must be today or later, and no more than
    `APPOINTMENT_BOOKING_WINDOW_DAYS` (default 14) days out

  ---

  ## Response (success — 200):-

  ```json
  {
    "date": "2026-09-21",
    "slots": [
      { "start_time": "09:00", "end_time": "09:30" },
      { "start_time": "09:30", "end_time": "10:00" }
    ]
  }
  ```

  An empty `slots` array means the doctor has no availability set for that
  weekday, every slot is already booked / in the past, or a break covers the
  whole remaining window.

  ---

  ## Error Responses

  * `404` — no doctor with that ID
  * `422` — `date` missing, wrongly formatted, in the past, or beyond the
    booking window

  ---
