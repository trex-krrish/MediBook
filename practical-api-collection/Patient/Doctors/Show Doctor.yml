info:
  name: Show Doctor
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/doctors/1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Overview

  Returns one doctor along with their weekly `availabilities` — the raw
  schedule template, not yet reduced to bookable slots for a specific date
  (that's `Available Slots`).

  ---

  ## Path Parameter

  * `{doctor}` — integer ID of the doctor

  ---

  ## Response (success — 200):-

  ```json
  {
    "data": {
      "id": 1,
      "name": "Dr. Sarah Johnson",
      "specialization": "Cardiology",
      "email": "sarah.johnson@example.com",
      "phone": "1234567890",
      "is_active": true,
      "availabilities": [
        {
          "id": 1,
          "doctor_id": 1,
          "day_of_week": 1,
          "start_time": "09:00",
          "end_time": "17:00"
        }
      ]
    }
  }
  ```

  ---

  ## Error Responses

  * `404` — no doctor with that ID

  ---
