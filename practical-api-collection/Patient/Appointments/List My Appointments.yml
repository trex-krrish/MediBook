info:
  name: List My Appointments
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/appointments"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Overview

  Returns only the logged-in patient's own appointments (booked and
  cancelled), newest date/time first, each with its `doctor` loaded. Other
  patients' appointments never appear here.

  ---

  ## Response (success — 200):-

  ```json
  {
    "data": [
      {
        "id": 7,
        "doctor": {
          "id": 1,
          "name": "Dr. Sarah Johnson",
          "specialization": "Cardiology",
          "email": "sarah.johnson@example.com",
          "phone": "1234567890",
          "is_active": true,
          "availabilities": []
        },
        "patient": [],
        "appointment_date": "2026-09-21",
        "start_time": "09:00",
        "end_time": "09:30",
        "status": "booked",
        "cancelled_at": null,
        "created_at": "2026-09-18T10:15:00+00:00"
      }
    ]
  }
  ```

  ---
