info:
  name: List Doctors
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/admin/doctors"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Overview

  Returns every doctor (active and inactive), each with its
  `availabilities` already loaded — this is how the admin views "the
  availability of all doctors" in one call, no N+1 follow-up requests needed.
  A doctor may list several periods for the same `day_of_week` (split
  schedules are allowed since `Admin / Availability / Add Availability Period`
  moved to a create-many-periods model).

  `breaks` is **not** included here (not eager-loaded by this endpoint) even
  though it's a defined field on the resource — see
  `Admin / Breaks / Add Break` for the only response that returns break data.

  ---

  ## Response (success — 200):-

  ```json
  {
    "data": [
      {
        "id": 1,
        "name": "Dr. Sarah Johnson",
        "specialization": "Cardiology",
        "email": "sarah.johnson@example.com",
        "phone": "1234567890",
        "is_active": true,
        "availabilities": [
          {
            "id": 1,
            "doctor_id": 1,
            "day_of_week": 1,
            "start_time": "09:00",
            "end_time": "17:00"
          }
        ]
      }
    ]
  }
  ```

  ---

  ## day_of_week:-

  * Integer `0`–`6`, Carbon's convention: `0` = Sunday … `6` = Saturday.
  * A doctor can have multiple rows for the same `day_of_week` — one per
    non-overlapping period (e.g. a 9–1 and a 2–5 row for the same Monday).
    Overlap between two periods on the same day is rejected at write time in
    `Admin / Availability / Add Availability Period`.

  ---
