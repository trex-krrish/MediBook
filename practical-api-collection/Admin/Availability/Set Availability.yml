info:
  name: Set Availability
  type: http
  seq: 1

http:
  method: PUT
  url: "{{base_url}}/admin/doctors/1/availability"
  body:
    type: json
    data: |-
      {
        "day_of_week": 1,
        "start_time": "09:00",
        "end_time": "17:00"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Overview

  Sets a doctor's single availability window for one day of the week.
  Calling this again with the same `day_of_week` **replaces** that day's
  window rather than adding a second one — a doctor can only ever have one
  availability period per day, by design.

  To give a doctor a full Mon–Fri 9–5 schedule, call this 5 times (once per
  `day_of_week`).

  ---

  ## Path Parameter

  * `{doctor}` — integer ID of the doctor

  ---

  ## day_of_week:-

  * Type: integer
  * Required: Yes
  * Range: `0`–`6` (Carbon convention — `0` = Sunday, `1` = Monday, …
    `6` = Saturday)

  ---

  ## start_time:-

  * Type: string
  * Required: Yes
  * Format: `H:i`, e.g. `09:00`

  ---

  ## end_time:-

  * Type: string
  * Required: Yes
  * Format: `H:i`, e.g. `17:00`
  * Must be after `start_time`

  ---

  ## Response (success — 201 on first set for that day, 200 when replacing):-

  ```json
  {
    "data": {
      "id": 2,
      "doctor_id": 1,
      "day_of_week": 1,
      "start_time": "09:00",
      "end_time": "17:00"
    }
  }
  ```

  ---

  ## Error Responses

  * `404` — no doctor with that ID
  * `422` — `errors.end_time` when it isn't after `start_time`, or either
    field isn't valid `H:i`

  ---
